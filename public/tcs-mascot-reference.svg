<?xml version="1.0" encoding="UTF-8"?>

<svg xmlns="http://www.w3.org/2000/svg" id="tcs-mascot" viewBox="0 0 440 560" width="440" height="560" role="img" aria-label="TCS Mascot, maskot resmi The Choco Studios" xmlns:c2pa="http://c2pa.org/manifest">
  <title>TCS Mascot</title>
  <style>
    /* Walk cycle: front-facing pose, limbs swing in opposite pairs. */
    #leg-right,#arm-left,#hand-left{transform-box:fill-box;transform-origin:50% 12%;animation:tcs-step-a .62s ease-in-out infinite alternate}
    #leg-left,#arm-right,#hand-right{transform-box:fill-box;transform-origin:50% 12%;animation:tcs-step-b .62s ease-in-out infinite alternate}
    #leg-left,#leg-right{transform-origin:50% 0%}
    #hand-left,#hand-right{transform-box:fill-box;transform-origin:50% 0%}
    #head{transform-box:fill-box;transform-origin:50% 100%;animation:tcs-head-bob .31s ease-in-out infinite alternate}
    #tail{transform-box:fill-box;transform-origin:0% 65%;animation:tcs-tail-wag .62s ease-in-out infinite alternate}
    #eye-left,#eye-right{transform-box:fill-box;transform-origin:50% 50%;animation:tcs-blink 4.2s linear infinite}
    @keyframes tcs-step-a{from{transform:rotate(-19deg)}to{transform:rotate(19deg)}}
    @keyframes tcs-step-b{from{transform:rotate(19deg)}to{transform:rotate(-19deg)}}
    @keyframes tcs-head-bob{from{transform:translateY(0)}to{transform:translateY(3px)}}
    @keyframes tcs-tail-wag{from{transform:rotate(-5deg)}to{transform:rotate(7deg)}}
    @keyframes tcs-blink{0%,91%,100%{transform:scaleY(1)}94%,97%{transform:scaleY(.08)}}
    @media(prefers-reduced-motion:reduce){#leg-right,#arm-left,#leg-left,#arm-right,#head,#tail,#eye-left,#eye-right{animation:none!important}}
  </style>

